name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:

  test:
    name: ${{ matrix.server }}-${{ matrix.version }} (${{ matrix.algorithm }}, sanitizer=${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {server: redis, version: '5.0', algorithm: scan, sanitizer: none}
          - {server: redis, version: '6.2', algorithm: scan, sanitizer: none}
          - {server: redis, version: '7.0', algorithm: scan, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: sort, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: slab, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: scan, sanitizer: address}
          - {server: redis, version: '7.0', algorithm: sort, sanitizer: address}
    # Prefixed so the server build does not read them: its Makefile rejects SANITIZER=none.
    env:
      MATRIX_SERVER: ${{ matrix.server }}
      MATRIX_VERSION: ${{ matrix.version }}
      MATRIX_ALGORITHM: ${{ matrix.algorithm }}
      MATRIX_SANITIZER: ${{ matrix.sanitizer }}
      MATRIX_COVERAGE: ${{ matrix.coverage && 'yes' || 'no' }}
    steps:
    - uses: actions/checkout@v7
    - name: install dependencies
      run: |
        sudo apt-get update
        packages=(tcl8.6 libssl-dev)
        if [ "$MATRIX_COVERAGE" = yes ]; then
          packages+=(lcov)
        fi
        sudo apt-get install -y "${packages[@]}"
    - name: clone and make server
      run: |
        case "$MATRIX_SERVER" in
          redis) repo=redis/redis ;;
          *) echo "unknown server: $MATRIX_SERVER" >&2; exit 1 ;;
        esac
        git clone --depth 1 --branch "$MATRIX_VERSION" "https://github.com/$repo.git" server
        # No -Werror: the server is a pinned third-party release, and newer compilers warn on its code.
        make_flags=(BUILD_TLS=yes)
        if [ "$MATRIX_SANITIZER" = address ]; then
          make_flags+=(SANITIZER=address MALLOC=libc)
        fi
        make -C server -j"$(nproc)" "${make_flags[@]}"
    - name: make tairhash
      run: |
        cmake_flags=()
        case "$MATRIX_ALGORITHM" in
          scan) ;;
          sort) cmake_flags+=(-DSORT_MODE=yes) ;;
          slab) cmake_flags+=(-DSLAB_MODE=yes) ;;
          *) echo "unknown algorithm: $MATRIX_ALGORITHM" >&2; exit 1 ;;
        esac
        if [ "$MATRIX_SANITIZER" = address ]; then
          cmake_flags+=(-DSANITIZER_MODE=address)
        fi
        if [ "$MATRIX_COVERAGE" = yes ]; then
          cmake_flags+=(-DGCOV_MODE=TRUE)
        fi
        cmake -S . -B build "${cmake_flags[@]}"
        cmake --build build -j"$(nproc)"
    - name: test
      run: |
        sed -e "s#your_path#$GITHUB_WORKSPACE/lib#g" tests/tairhash.tcl > server/tests/unit/type/tairhash.tcl
        cd server
        runtest_args=(--single unit/type/tairhash --clients 1)
        # Older harnesses (Redis 5.0) do not support --dump-logs.
        if grep -q -- '--dump-logs' tests/test_helper.tcl; then
          runtest_args+=(--dump-logs)
        fi
        ./runtest "${runtest_args[@]}"
    - name: lcov collection
      if: matrix.coverage
      run: lcov -c -d build -o build/cover.info
    - uses: codecov/codecov-action@v7
      if: matrix.coverage
      with:
        files: build/cover.info
        flags: ${{ matrix.algorithm }}
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
