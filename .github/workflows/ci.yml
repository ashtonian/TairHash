  test-ubuntu-with-valkey:
    name: test-ubuntu-with-valkey-${{ matrix.valkey }} (${{ matrix.algorithm }}, sanitizer=${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        valkey: ['9.1.3']
        algorithm: [scan, sort, slab]
        sanitizer: [none, address]
        include:
          - algorithm: sort
            algorithm_flag: -DSORT_MODE=yes
          - algorithm: slab
            algorithm_flag: -DSLAB_MODE=yes
    # Prefixed so the server build does not read them: its Makefile rejects SANITIZER=none.
    env:
      MATRIX_VERSION: ${{ matrix.valkey }}
      MATRIX_ALGORITHM_FLAG: ${{ matrix.algorithm_flag }}
      MATRIX_SANITIZER: ${{ matrix.sanitizer }}
    steps:
    - uses: actions/checkout@v7
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl8.6 libssl-dev
    - name: clone and make valkey
      run: |
        git clone --depth 1 --branch "$MATRIX_VERSION" https://github.com/valkey-io/valkey.git valkey
        # No -Werror: the server is a pinned third-party release, and newer compilers warn on its code.
        make_flags=(BUILD_TLS=yes)
        if [ "$MATRIX_SANITIZER" = address ]; then
          make_flags+=(SANITIZER=address MALLOC=libc)
        fi
        make -C valkey -j"$(nproc)" "${make_flags[@]}"
    - name: make tairhash
      run: |
        cmake_flags=()
        if [ -n "$MATRIX_ALGORITHM_FLAG" ]; then
          cmake_flags+=("$MATRIX_ALGORITHM_FLAG")
        fi
        if [ "$MATRIX_SANITIZER" = address ]; then
          cmake_flags+=(-DSANITIZER_MODE=address)
        fi
        cmake -S . -B build "${cmake_flags[@]}"
        cmake --build build -j"$(nproc)"
    - name: test
      run: |
        sed -e "s#your_path#$GITHUB_WORKSPACE/lib#g" tests/tairhash.tcl > valkey/tests/unit/type/tairhash.tcl
        cd valkey
        ./runtest --single unit/type/tairhash --clients 1 --dump-logs
